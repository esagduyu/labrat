[project]
name = "labrat"
version = "0.1.0"
description = "LabRat — terminal-native data agent. Find the cheese in your maze."
readme = "README.md"
authors = [
    { name = "Ege Sagduyu", email = "esagduyu@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "dbt-duckdb>=1.8",
    "dspy-ai[optuna]>=2.5",
    "duckdb>=1.1",
    "pandas>=2.0",
    "google-cloud-bigquery>=3.41.0",
    "jinja2>=3.1.6",
    "keyring>=25",
    "matplotlib>=3.10.9",
    "mcp>=1.0",
    "openai>=1.50",
    "plotext>=5.3",
    "polars>=1.10",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.9",
    "pymysql>=1.2.0",
    "pyyaml>=6",
    "redshift-connector>=2.1.14",
    "rich>=13",
    "rich-pyfiglet>=0.1",
    "snowflake-connector-python>=4.5.0",
    "sqlglot>=25",
    "structlog>=24",
    "textual>=0.85",
    "textual-image>=0.12.0",
    "tree-sitter>=0.23",
    "tree-sitter-sql>=0.3.11",
    "trino>=0.337.0",
    "typer>=0.13",
    "watchdog>=4",
    "pymongo>=4.17.0",
]

[project.scripts]
labrat = "labrat.cli:app"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP", "RUF"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501", "E402", "E701", "E702", "N806", "RUF001", "RUF012", "RUF015"]

[tool.pyright]
include = ["src"]
strict = ["src/labrat"]
ignore = [
    "src/labrat/dspy_opt",   # dspy/pandas have no type stubs
    "src/labrat/screens",    # Textual DataTable/app stubs are incomplete
]
pythonVersion = "3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "hypothesis>=6",
    "pyright>=1.1",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "pytest-textual-snapshot>=1",
    "ruff>=0.7",
    "testcontainers>=4",
]
