[project]
name = "labrat"
version = "0.1.0"
description = "LabRat — terminal-native data agent. Find the cheese in your maze."
readme = "README.md"
authors = [
    { name = "Ege Sagduyu", email = "esagduyu@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "duckdb>=1.1",
    "jinja2>=3.1.6",
    "keyring>=25",
    "matplotlib>=3.10.9",
    "openai>=1.50",
    "plotext>=5.3",
    "polars>=1.10",
    "pydantic>=2.9",
    "rich>=13",
    "rich-pyfiglet>=0.1",
    "sqlglot>=25",
    "structlog>=24",
    "textual>=0.85",
    "textual-image>=0.12.0",
    "tree-sitter>=0.23",
    "tree-sitter-sql>=0.3.11",
    "typer>=0.13",
]

[project.scripts]
labrat = "labrat.cli:app"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP", "RUF"]

[tool.pyright]
include = ["src"]
strict = ["src/labrat"]
pythonVersion = "3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "hypothesis>=6",
    "pyright>=1.1",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "pytest-textual-snapshot>=1",
    "ruff>=0.7",
    "testcontainers>=4",
]
